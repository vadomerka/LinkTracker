server:
  port: 8081

spring:
  application:
    name: scrapper
  data:
    redis:
      repositories:
        enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/scrapper
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094 # ,localhost:9093,localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      enable-idempotence: true

app:
  stackoverflow:
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}
  github:
    token: ${GITHUB_TOKEN}
  telegram:
    tgUrl: ${TELEGRAM_BOT_URL}
  requests:
    type: http
  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094 # ,localhost:9093,localhost:9094
    topic: link.raw-updates
    group: groupB
  valkey:
    enabled: true
    password:
    cluster:
      nodes:
        - localhost:7001
        - localhost:7002
        - localhost:7003
    list-cache:
      ttl: 10m
      key-prefix: "list:"
  rate-limit:
    capacity: 60
    refill-tokens: 60
    refill-period: 1m
  http:
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    retryable-statuses:
      - 429
      - 502
      - 503
      - 504

resilience4j:
  retry:
    instances:
      github:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - backend.academy.linktracker.scrapper.resilience.RetryableException
      stackoverflow:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - backend.academy.linktracker.scrapper.resilience.RetryableException
      bot-http:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - backend.academy.linktracker.scrapper.resilience.RetryableException
  circuitbreaker:
    instances:
      github:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      stackoverflow:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      bot-http:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

